# Sürüm etiketi atıldığında paketi NuGet'e gönderir.
#
#   git tag v0.9.0 && git push origin v0.9.0
#
# Kimlik doğrulama TRUSTED PUBLISHING ile: depoda saklanan uzun ömürlü bir
# anahtar YOK. GitHub koşuya kısa ömürlü, imzalı bir OIDC belirteci veriyor;
# nuget.org onu kendi kayıtlı ilkesiyle karşılaştırıp bir saatlik geçici anahtar
# üretiyor. Sızacak, dolacak ya da döndürülecek bir sır kalmıyor.
#
# Şart: nuget.org → Trusted Publishing'de bu depoya bir ilke tanımlı olmalı —
# Repository Owner "omerdemir2000", Repository "Pica.Reports", Workflow File
# "release.yml", Environment boş. Dördü de birebir eşleşmezse belirteç
# reddedilir. Bu dosyanın ADI ilkeye yazılı: yeniden adlandırırsanız ilkeyi de
# güncelleyin.
#
# Sürüm numarası csproj'dan okunur; etiket yalnızca tetikleyicidir. İkisini
# birbirine karıştırmamak için etiketi sürümle aynı yazın.
name: release

on:
  push:
    tags: ['v*']

jobs:
  yayimla:
    runs-on: ubuntu-latest

    # OIDC belirtecini üretme izni. Olmadan NuGet/login kimlik doğrulayamaz ve
    # adım "id-token" hatasıyla düşer. contents okumaya indiriliyor: varsayılan
    # izin kümesi bu iş için fazla geniş.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derle ve sına
        run: |
          dotnet restore Pica.Reports.slnx
          dotnet build Pica.Reports.slnx --configuration Release --no-restore
          dotnet test src/Pica.Reports.Testleri --configuration Release --no-build

      - name: Paketle
        run: dotnet pack src/Pica.Reports --configuration Release --no-build --output artifacts

      # Geçici anahtar BİR SAAT geçerli ve gönderimden hemen önce alınıyor:
      # derleme ile sınama uzun sürerse baştan alınmış bir anahtar yolda ölürdü.
      # Belirteç tek kullanımlık — bir belirteç, bir anahtar.
      - name: NuGet oturumu (OIDC → geçici anahtar)
        uses: NuGet/login@v1
        id: oturum
        with:
          # nuget.org PROFİL adı, e-posta değil. Gizli değer değil: paket
          # sayfasında sahibi olarak zaten herkese görünüyor.
          user: omerdemir2000

      - name: NuGet'e gönder
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ steps.oturum.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
